@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
.rise { animation: rise .7s ease-out backwards; }
.fade { animation: fade .45s ease-out backwards; }
.pulse { animation: pulse 2.2s ease-in-out infinite; }
.blink { animation: blink 1.05s step-end infinite; }

@keyframes rot { 0% { opacity: 0; transform: translateY(10px); } 4% { opacity: 1; transform: none; }
                 21% { opacity: 1; transform: none; } 25% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 0; } }
.r { opacity: 0; animation: rot 16s ease-in-out infinite; }

</style>

