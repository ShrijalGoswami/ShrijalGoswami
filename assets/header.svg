<text class="r" x="60" y="290" font-size="24" fill="#8B98A9" style="animation-delay:0s">I build the part of AI that survives real traffic.</text><text class="r" x="60" y="290" font-size="24" fill="#8B98A9" style="animation-delay:4s">Hybrid retrieval: BM25 + dense, fused at α = 0.65.</text><text class="r" x="60" y="290" font-size="24" fill="#8B98A9" style="animation-delay:8s">Models you can audit, not just admire.</text><text class="r" x="60" y="290" font-size="24" fill="#8B98A9" style="animation-delay:12s">Notebook → live endpoint → still running next month.</text>
